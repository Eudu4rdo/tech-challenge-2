apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: tech-challenge-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          # AJUSTAR: substituir pela imagem publicada no ECR
          image: 686391723150.dkr.ecr.us-east-1.amazonaws.com/tech-challenge-2/auth-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            # AJUSTAR: usar a URL do RDS auth-db real depois do provisionamento
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: DATABASE_URL
            # AJUSTAR: substituir pela chave mestra real do auth-service
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: MASTER_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
