apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: tech-challenge-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      # AJUSTAR: esta service account precisa existir com IRSA e permissao para SQS/DynamoDB
      serviceAccountName: analytics-service-sa
      containers:
        - name: analytics-service
          # AJUSTAR: substituir pela imagem publicada no ECR
          image: <account-id>.dkr.ecr.<region>.amazonaws.com/analytics-service:<tag>
          ports:
            - containerPort: 8005
          env:
            - name: PORT
              value: "8005"
            # AJUSTAR: manter a regiao do ambiente AWS
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: analytics-config
                  key: AWS_REGION
            # AJUSTAR: usar a URL real da fila SQS
            - name: AWS_SQS_URL
              valueFrom:
                configMapKeyRef:
                  name: analytics-config
                  key: AWS_SQS_URL
            # AJUSTAR: manter exatamente o nome da tabela DynamoDB criada
            - name: AWS_DYNAMODB_TABLE
              valueFrom:
                configMapKeyRef:
                  name: analytics-config
                  key: AWS_DYNAMODB_TABLE
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
