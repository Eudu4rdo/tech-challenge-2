apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: tech-challenge-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      # AJUSTAR: esta service account precisa existir com IRSA e permissao para SQS
      serviceAccountName: evaluation-service-sa
      containers:
        - name: evaluation-service
          # AJUSTAR: substituir pela imagem publicada no ECR
          image: <account-id>.dkr.ecr.<region>.amazonaws.com/evaluation-service:<tag>
          ports:
            - containerPort: 8004
          env:
            - name: PORT
              value: "8004"
            # AJUSTAR: apontar para o Redis real do ElastiCache
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: evaluation-config
                  key: REDIS_URL
            # AJUSTAR: manter os endpoints internos dos outros servicos
            - name: FLAG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: FLAG_SERVICE_URL
            # AJUSTAR: manter os endpoints internos dos outros servicos
            - name: TARGETING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TARGETING_SERVICE_URL
            # AJUSTAR: manter a regiao do ambiente AWS
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AWS_REGION
            # AJUSTAR: usar a URL real da fila SQS
            - name: AWS_SQS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AWS_SQS_URL
            # AJUSTAR: substituir pela chave gerada no auth-service
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: evaluation-secrets
                  key: SERVICE_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
